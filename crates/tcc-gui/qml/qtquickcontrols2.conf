// Configuration Qt Quick Controls 2 du shell.
// Le style Basic est utilisé comme base : tous les contrôles visibles sont
// redéfinis dans qml/components (boutons, champs, curseurs, listes).
//
// Ce fichier est installé à côté du binaire (ou dans
// /usr/share/tuxedo-rust-center/) et chargé via QT_QUICK_CONTROLS_CONF.
// La police est aussi posée dans Main.qml (ApplicationWindow.font) et via
// FontLoader pour rester correcte même si ce fichier est absent.

[Controls]
Style=Basic

[Font]
Family=Titillium Web
PixelSize=14
