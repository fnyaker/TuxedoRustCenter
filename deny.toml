# Politique cargo-deny — TuxedoRustCenter
#
# Applique docs/security/DECISIONS.md et docs/security/THREAT_MODEL.md
# (A8, F11) : licences compatibles GPL-3.0-or-later, pas de crate non publiée
# sur crates.io, pas de version yankée, pas de wildcard.
#
# Commandes de référence :
#   cargo deny check
#   cargo audit
#
# Toute nouvelle dépendance doit être justifiée en revue. Si sa licence n'est
# pas listée, la liste est mise à jour explicitement — jamais en désactivant
# le contrôle.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BlueOak-1.0.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
