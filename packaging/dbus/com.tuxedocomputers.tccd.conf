<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
    "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  Politique D-Bus système de TuxedoRustCenter — fail-closed.

  Principe (docs/security/REVIEW_JALON1.md §4.1, R-02/R-08) :
    1. deny global de `send_destination` pour tous les noms (tccd, Admin,
       Admin.Hw) ;
    2. allow uniquement par interface ou par membre ;
    3. la DERNIÈRE règle qui correspond gagne : aucun allow générique ne doit
       être ajouté après les deny.

  Toute méthode ajoutée à l'interface de compatibilité sans mise à jour de ce
  fichier sera donc INJOIGNABLE depuis le bus. Toute nouvelle méthode doit être
  ajoutée ici, avec son test de politique.

  RISQUE RÉSIDUEL DOCUMENTÉ — `SetTempProfile` / `ClearTempProfile` :
  ces deux setters de la couche de compatibilité restent ouverts aux
  utilisateurs locaux (la GUI et le tray en ont besoin). Ils changent le profil
  matériel actif jusqu'au prochain changement d'état, sans persistance ni accès
  fichier. Mesures attendues au jalon 2 (R-03) :
    * token bucket par nom unique + journalisation caller_uid / unique_name ;
    * option stricte multi-utilisateur : CheckAuthorization sur
      com.tuxedocomputers.tccd1.temp-profile (action non déclarée à ce jour).
  Voir docs/packaging/SECURITY.md §3.
-->
<busconfig>
    <type>system</type>

    <policy user="root">
        <allow own="com.tuxedocomputers.tccd"/>
        <allow own="com.tuxedocomputers.tccd.Admin"/>
        <allow own="com.tuxedocomputers.tccd.Admin.Hw"/>
        <allow send_destination="com.tuxedocomputers.tccd"/>
        <allow send_destination="com.tuxedocomputers.tccd.Admin"/>
        <allow send_destination="com.tuxedocomputers.tccd.Admin.Hw"/>
        <allow receive_sender="com.tuxedocomputers.tccd"/>
        <allow receive_sender="com.tuxedocomputers.tccd.Admin"/>
        <allow receive_sender="com.tuxedocomputers.tccd.Admin.Hw"/>
        <!-- AD-6 : rechargement de configuration demandé par tccd-admin.
             Root uniquement ; tccd re-vérifie l'UID appelant. -->
        <allow send_destination="com.tuxedocomputers.tccd"
               send_interface="com.tuxedocomputers.tccd.Control1"
               send_member="ReloadConfig"/>
    </policy>

    <policy context="default">
        <!-- 0. Personne d'autre que root ne possède les noms. -->
        <deny own="com.tuxedocomputers.tccd"/>
        <deny own="com.tuxedocomputers.tccd.Admin"/>
        <deny own="com.tuxedocomputers.tccd.Admin.Hw"/>

        <!-- 1. Refus par défaut : tout ce qui n'est pas autorisé ci-dessous
                est refusé, y compris les futures interfaces. -->
        <deny send_destination="com.tuxedocomputers.tccd"/>
        <deny send_destination="com.tuxedocomputers.tccd.Admin"/>
        <deny send_destination="com.tuxedocomputers.tccd.Admin.Hw"/>

        <!-- 2. Introspection uniquement. Pas de Properties.Get/GetAll :
                la version du contrat passe par Manager1.GetContractVersion
                (P-12). Cela évite d'exposer automatiquement toute propriété
                future de tccd. Properties.Set n'est autorisé nulle part. -->
        <allow send_destination="com.tuxedocomputers.tccd"
               send_interface="org.freedesktop.DBus.Introspectable"/>
        <allow send_destination="com.tuxedocomputers.tccd"
               send_interface="org.freedesktop.DBus.Peer"/>

        <!-- 3. Couche JSON de compatibilité, membre par membre. -->
        <allow send_destination="com.tuxedocomputers.tccd"
               send_interface="com.tuxedocomputers.tccd" send_member="Ping"/>
        <allow send_destination="com.tuxedocomputers.tccd"
               send_interface="com.tuxedocomputers.tccd" send_member="GetVersion"/>
        <allow send_destination="com.tuxedocomputers.tccd"
               send_interface="com.tuxedocomputers.tccd" send_member="GetStateJSON"/>
        <allow send_destination="com.tuxedocomputers.tccd"
               send_interface="com.tuxedocomputers.tccd" send_member="GetActiveProfileJSON"/>
        <allow send_destination="com.tuxedocomputers.tccd"
               send_interface="com.tuxedocomputers.tccd" send_member="GetProfilesJSON"/>
        <allow send_destination="com.tuxedocomputers.tccd"
               send_interface="com.tuxedocomputers.tccd" send_member="GetSettingsJSON"/>
        <allow send_destination="com.tuxedocomputers.tccd"
               send_interface="com.tuxedocomputers.tccd" send_member="GetFanDataJSON"/>

        <!-- 3bis. Profil temporaire : setters de compatibilité explicitement
                listés. Risque résiduel documenté ci-dessus ; sera déplacé sur
                Manager1 (avec rate limit et audit) au jalon 2. -->
        <allow send_destination="com.tuxedocomputers.tccd"
               send_interface="com.tuxedocomputers.tccd" send_member="SetTempProfile"/>
        <allow send_destination="com.tuxedocomputers.tccd"
               send_interface="com.tuxedocomputers.tccd" send_member="ClearTempProfile"/>

        <!-- 4. API typée Manager1 : LECTURE et bail capteurs uniquement.
                Les 8 setters matériels sont en deny explicite en attendant
                la levée de M1-01 (bucket UID + DialogGate) et M1-02
                (lighting respectant keyboard_backlight_control_enabled).
                Ne pas ouvrir avant revue security. Aucun allow d'interface. -->
        <allow send_destination="com.tuxedocomputers.tccd"
               send_interface="com.tuxedocomputers.tccd.Manager1"
               send_member="GetContractVersion"/>
        <allow send_destination="com.tuxedocomputers.tccd"
               send_interface="com.tuxedocomputers.tccd.Manager1"
               send_member="GetHardwareSnapshotJSON"/>
        <allow send_destination="com.tuxedocomputers.tccd"
               send_interface="com.tuxedocomputers.tccd.Manager1"
               send_member="GetSensorDataCollectionStatus"/>
        <!-- Minuterie d'extinction : lecture seule, sans polkit. Le réglage
             passe par Admin1.SaveSettingsJSON (Settings.shutdownTime). -->
        <allow send_destination="com.tuxedocomputers.tccd"
               send_interface="com.tuxedocomputers.tccd.Manager1"
               send_member="GetShutdownTimerJSON"/>
        <!-- Bail de collecte capteurs : ce n'est pas une écriture matérielle,
             mais il est soumis au plafond de durée et au rate limit du daemon
             (REVIEW_HARDWARE H-02). -->
        <allow send_destination="com.tuxedocomputers.tccd"
               send_interface="com.tuxedocomputers.tccd.Manager1"
               send_member="SetSensorDataCollectionStatus"/>

        <!-- 4bis. M1-01/M1-02 : setters Manager1 BLOQUÉS au bus.
                  Les actions polkit tccd1.charging / .settings restent
                  installées pour l'ouverture future. Réouverture seulement
                  après correction M1-01 (bucket par UID + DialogGate) et
                  M1-02 (respect de keyboard_backlight_control_enabled) et
                  revue security. Chaque membre est refusé explicitement. -->
        <deny send_destination="com.tuxedocomputers.tccd"
              send_interface="com.tuxedocomputers.tccd.Manager1"
              send_member="SetChargingProfile"/>
        <deny send_destination="com.tuxedocomputers.tccd"
              send_interface="com.tuxedocomputers.tccd.Manager1"
              send_member="SetChargingPriority"/>
        <deny send_destination="com.tuxedocomputers.tccd"
              send_interface="com.tuxedocomputers.tccd.Manager1"
              send_member="SetChargeStartThreshold"/>
        <deny send_destination="com.tuxedocomputers.tccd"
              send_interface="com.tuxedocomputers.tccd.Manager1"
              send_member="SetChargeEndThreshold"/>
        <deny send_destination="com.tuxedocomputers.tccd"
              send_interface="com.tuxedocomputers.tccd.Manager1"
              send_member="SetChargeType"/>
        <deny send_destination="com.tuxedocomputers.tccd"
              send_interface="com.tuxedocomputers.tccd.Manager1"
              send_member="SetKeyboardStatesJSON"/>
        <deny send_destination="com.tuxedocomputers.tccd"
              send_interface="com.tuxedocomputers.tccd.Manager1"
              send_member="SetLightbarStatesJSON"/>
        <deny send_destination="com.tuxedocomputers.tccd"
              send_interface="com.tuxedocomputers.tccd.Manager1"
              send_member="SetFnLockStatus"/>

        <!-- 5. Signaux : les clients reçoivent StateChanged. -->
        <allow receive_sender="com.tuxedocomputers.tccd"/>

        <!-- 6. Admin1 phase 1 : persistance des profils/réglages + reload,
                plus les lectures de diagnostic/négociation de contrat.
                Membres listés un par un (AD-2). Le bus ne fait pas
                l'autorisation par utilisateur : polkit tranchera DANS
                tccd-admin (AD-3/AD-4). Aucun allow d'interface Admin1.
                A1-11 : la version du contrat passe par
                `Admin1.GetContractVersion`, PAS par Properties : aucun
                allow Properties sur .Admin (une propriété future serait
                exposée automatiquement). Properties.Set n'est autorisé
                nulle part. -->
        <allow send_destination="com.tuxedocomputers.tccd.Admin"
               send_interface="org.freedesktop.DBus.Introspectable"/>
        <allow send_destination="com.tuxedocomputers.tccd.Admin"
               send_interface="org.freedesktop.DBus.Peer"/>
        <allow send_destination="com.tuxedocomputers.tccd.Admin"
               send_interface="com.tuxedocomputers.tccd.Admin1"
               send_member="Ping"/>
        <allow send_destination="com.tuxedocomputers.tccd.Admin"
               send_interface="com.tuxedocomputers.tccd.Admin1"
               send_member="GetVersion"/>
        <allow send_destination="com.tuxedocomputers.tccd.Admin"
               send_interface="com.tuxedocomputers.tccd.Admin1"
               send_member="GetContractVersion"/>
        <allow send_destination="com.tuxedocomputers.tccd.Admin"
               send_interface="com.tuxedocomputers.tccd.Admin1"
               send_member="SaveProfilesJSON"/>
        <allow send_destination="com.tuxedocomputers.tccd.Admin"
               send_interface="com.tuxedocomputers.tccd.Admin1"
               send_member="SaveSettingsJSON"/>
        <allow send_destination="com.tuxedocomputers.tccd.Admin"
               send_interface="com.tuxedocomputers.tccd.Admin1"
               send_member="ReloadConfig"/>

        <!-- 6bis. Les setters de phase 2 (TDP/ODM/cTGP/PRIME) et les
                  opérations phase 3 (Tomte/paquets) sont explicitement
                  refusés pour que leur activation future soit un changement
                  conscient. LUKS est hors périmètre (décision utilisateur) :
                  aucune méthode ni action n'est prévue. Properties.Set reste
                  absent : aucune propriété n'est inscriptible par le bus. -->
        <deny send_destination="com.tuxedocomputers.tccd.Admin"
              send_interface="com.tuxedocomputers.tccd.Admin1"
              send_member="SetTdpValues"/>
        <deny send_destination="com.tuxedocomputers.tccd.Admin"
              send_interface="com.tuxedocomputers.tccd.Admin1"
              send_member="SetOdmProfile"/>
        <deny send_destination="com.tuxedocomputers.tccd.Admin"
              send_interface="com.tuxedocomputers.tccd.Admin1"
              send_member="SetNvidiaCtgpOffset"/>
        <deny send_destination="com.tuxedocomputers.tccd.Admin"
              send_interface="com.tuxedocomputers.tccd.Admin1"
              send_member="SetPrimeMode"/>
        <deny send_destination="com.tuxedocomputers.tccd.Admin"
              send_interface="com.tuxedocomputers.tccd.Admin1"
              send_member="TomteRun"/>
        <deny send_destination="com.tuxedocomputers.tccd.Admin"
              send_interface="com.tuxedocomputers.tccd.Admin1"
              send_member="PackagesApply"/>

        <!-- 6ter. Control1.ReloadConfig : root uniquement (AD-6). Le deny
                    explicite documente l'intention et protège contre un futur
                    allow générique. tccd re-vérifie l'UID == 0. -->
        <deny send_destination="com.tuxedocomputers.tccd"
              send_interface="com.tuxedocomputers.tccd.Control1"
              send_member="ReloadConfig"/>

        <allow receive_sender="com.tuxedocomputers.tccd.Admin"/>

        <!-- 7. Admin.Hw phase 2 (AD-12 option B2) : TDP/ODM/cTGP.
                Le fichier de politique est TOUJOURS installé ; le service et
                son activation D-Bus ne le sont que si TCC_WITH_ADMIN_HW=1.
                Aucun allow d'interface AdminHw1 : chaque membre est listé un
                par un (le deny d'interface ci-dessous rend le reste
                injoignable). Aucun Properties.Get/GetAll/Set (A1-11) : la
                version du contrat passe par AdminHw1.GetContractVersion.
                Polkit tranche DANS tccd-admin-hw (power-limits) ; le bus ne
                fait pas l'autorisation par utilisateur. -->
        <allow send_destination="com.tuxedocomputers.tccd.Admin.Hw"
               send_interface="org.freedesktop.DBus.Introspectable"/>
        <allow send_destination="com.tuxedocomputers.tccd.Admin.Hw"
               send_interface="org.freedesktop.DBus.Peer"/>
        <!-- Refus explicite de toute l'interface, AVANT les allow par
             membre : une méthode future non listée reste injoignable. -->
        <deny send_destination="com.tuxedocomputers.tccd.Admin.Hw"
              send_interface="com.tuxedocomputers.tccd.AdminHw1"/>
        <deny send_destination="com.tuxedocomputers.tccd.Admin.Hw"
              send_interface="org.freedesktop.DBus.Properties"/>
        <allow send_destination="com.tuxedocomputers.tccd.Admin.Hw"
               send_interface="com.tuxedocomputers.tccd.AdminHw1"
               send_member="Ping"/>
        <allow send_destination="com.tuxedocomputers.tccd.Admin.Hw"
               send_interface="com.tuxedocomputers.tccd.AdminHw1"
               send_member="GetVersion"/>
        <allow send_destination="com.tuxedocomputers.tccd.Admin.Hw"
               send_interface="com.tuxedocomputers.tccd.AdminHw1"
               send_member="GetContractVersion"/>
        <allow send_destination="com.tuxedocomputers.tccd.Admin.Hw"
               send_interface="com.tuxedocomputers.tccd.AdminHw1"
               send_member="GetTdpValues"/>
        <allow send_destination="com.tuxedocomputers.tccd.Admin.Hw"
               send_interface="com.tuxedocomputers.tccd.AdminHw1"
               send_member="SetTdpValues"/>
        <allow send_destination="com.tuxedocomputers.tccd.Admin.Hw"
               send_interface="com.tuxedocomputers.tccd.AdminHw1"
               send_member="SetOdmProfile"/>
        <allow send_destination="com.tuxedocomputers.tccd.Admin.Hw"
               send_interface="com.tuxedocomputers.tccd.AdminHw1"
               send_member="SetOdmProfileOverride"/>
        <allow send_destination="com.tuxedocomputers.tccd.Admin.Hw"
               send_interface="com.tuxedocomputers.tccd.AdminHw1"
               send_member="SetNvidiaCtgpOffset"/>
        <allow receive_sender="com.tuxedocomputers.tccd.Admin.Hw"/>
    </policy>
</busconfig>
