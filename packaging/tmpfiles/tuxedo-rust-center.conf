# TuxedoRustCenter — répertoires runtime et état.
#
# StateDirectory= et RuntimeDirectory= de tccd.service couvrent les
# installations systemd. Ce fichier sert aux installations non packagées et
# garantit les modes/permissions.
#
# D2 : /etc/tuxedo-rust-center contient la configuration administrateur, en
# lecture seule pour le daemon. L'état mutable (profils/settings) vit dans
# /var/lib/tuxedo-rust-center.
#
# Type Path                         Mode User Group Age Argument
d /run/tuxedo-rust-center          0755 root root  -
d /var/lib/tuxedo-rust-center      0755 root root  -
d /etc/tuxedo-rust-center          0755 root root  -
