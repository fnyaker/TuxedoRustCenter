[workspace]
resolver = "3"
members = [
    "crates/tcc-core",
    "crates/tcc-ipc",
    "crates/tcc-authz",
    "crates/tcc-hw",
    "crates/tcc-daemon",
    "crates/tcc-admin",
    "crates/tcc-user",
    "crates/tcc-gui",
    "crates/tcc-launcher",
    "crates/tcc-client",
    "crates/tcc-cli",
]

# tcc-gpui a son propre workspace : gpui embarque zbus avec le backend async-io,
# incompatible avec le backend tokio du reste du projet (unification de features).
exclude = ["crates/tcc-gpui"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["TuxedoRustCenter contributors"]
repository = "https://github.com/fnyaker/TuxedoRustCenter"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
async-trait = "0.1"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.45", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.16", features = ["serde", "v4"] }
zbus = { version = "5.5", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
