# Politique cargo-deny — TuxedoRustCenter
#
# Applique docs/security/DECISIONS.md et docs/security/THREAT_MODEL.md
# (A8, F11) : licences compatibles GPL-3.0-or-later, pas de crate non publiée
# sur crates.io, pas de version yankée, pas de wildcard.
#
# Commandes de référence :
#   cargo deny check
#   cargo audit
#
# Toute nouvelle dépendance doit être justifiée en revue. Si sa licence n'est
# pas listée, la liste est mise à jour explicitement — jamais en désactivant
# le contrôle.

[graph]
all-features = true

[advisories]
yanked = "deny"
# zbus 5.x embarque `zvariant`, `zvariant_derive` et `zbus_names`, marquées
# « unmaintained » depuis leur fusion dans zbus 6.0 (RUSTSEC-2026-0370 à 0372,
# aucune vulnérabilité). Migration vers zbus 6 suivie séparément ; retirer ces
# entrées dès qu'elle est faite.
ignore = [
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BlueOak-1.0.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Les dépendances entre crates du workspace sont des dépendances de chemin
# sans version (`{ path = "../tcc-core" }`) : ce ne sont pas des wildcards de
# registre. Les wildcards restent refusés pour les crates publiées.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
